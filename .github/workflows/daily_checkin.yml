name: Daily-HiFiTi-Checkin

on:
  workflow_dispatch:
  schedule:
    - cron: "16 15 * * *"

jobs:
  checkin:
    name: Checkin
    runs-on: ubuntu-latest
    env:
      ACCOUNTS: ${{ secrets.ACCOUNTS }}
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      TELEGRAM_TO: ${{ secrets.TELEGRAM_TO }}

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Checkin
        id: checkin
        shell: bash
        run: |
          node main.js

      # --- 新增步骤：自动更新 README 以防止仓库休眠 ---
      - name: Update README
        if: ${{ success() }}
        run: |
          # 配置 Git 用户信息
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          # 获取当前时间（UTC+8 北京时间）
          CURRENT_TIME=$(date -u -d '8 hours' '+%Y-%m-%d %H:%M:%S')
          
          # 在 README.md 末尾追加打卡时间记录
          echo "🟢 **自动保活打卡成功** - 时间: ${CURRENT_TIME} (UTC+8)" >> log.md
          
          # 提交并推送更改
          git add README.md
          git commit -m "chore: auto update checkin time to prevent repo hibernation"
          git push
      # ---------------------------------------------

      - name: Notify
        if: ${{ always() && env.TELEGRAM_TOKEN && env.TELEGRAM_TO }}
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_TO }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          format: markdown
          message: |
            *HiFiTi 自动签到*

            ${{ steps.checkin.outputs.result }}

            任务详情
